# Single source of truth for dependency versions.
#
# To target a different Minecraft version, change `mcpl` and `minecraft` together and rebuild.
# Nothing outside chronit-driver-mcpl needs to change.

[versions]
minecraft = "26.2"

# MCProtocolLib publishes only snapshots. Pinned to an exact timestamped build so the same commit
# always resolves the same bytes — plain `26.2-SNAPSHOT` would silently pick up whatever was
# published most recently.
mcpl = "26.2-20260809.160751-16"

# The adventure release MCProtocolLib compiles against. Only the plain-text serializer is added
# here; the rest arrives transitively.
adventure = "5.2.0"

minecraftauth = "5.0.2"
viaversion = "5.11.0"
vialoader = "3.0.4"

jackson = "2.22.1"
cronutils = "9.2.1"
picocli = "4.7.7"
slf4j = "2.0.16"
logback = "1.6.2"
junit = "6.1.3"

shadow = "9.6.1"

[libraries]
mcprotocollib = { module = "org.geysermc.mcprotocollib:protocol", version.ref = "mcpl" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
minecraftauth = { module = "net.raphimc:MinecraftAuth", version.ref = "minecraftauth" }

viaversion = { module = "com.viaversion:viaversion", version.ref = "viaversion" }
viabackwards = { module = "com.viaversion:viabackwards", version.ref = "viaversion" }
vialoader = { module = "net.raphimc:ViaLoader", version.ref = "vialoader" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

cronutils = { module = "com.cronutils:cron-utils", version.ref = "cronutils" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
jackson = ["jackson-databind", "jackson-yaml", "jackson-jsr310"]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
